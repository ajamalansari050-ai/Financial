<!DOCTYPE html>
<html lang="hi">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RCYSCD4P57"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RCYSCD4P57');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Blog - Fengoo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .article-list-item {
            background: #1e293b;
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        .article-list-item:hover {
            border-color: #38bdf8;
            background: #273548;
        }
        .article-title {
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
        }
        .full-article-content {
            display: none;
            background: #0f172a;
            padding: 20px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
            color: #94a3b8;
            line-height: 1.8;
        }
        .back-to-list-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Top Dashboard Header -->
    <header class="dashboard-header">
        <div class="logo-container">
            <a href="../index.html" style="text-decoration: none; color: inherit;">
                <h2>Fengoo<span>.in</span></h2>
            </a>
        </div>
        
        <!-- Language Switcher Dropdown -->
        <div class="lang-switcher-container">
            <select id="languageSelect" onchange="changeLanguage(this.value)" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; outline: none; font-size: 0.9rem;">
                <option value="hi">हिंदी</option>
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="mr">मराठी</option>
                <option value="gu">ગુજરાતી</option>
                <option value="ta">தமிழ்</option>
                <option value="te">తెలుగు</option>
            </select>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="dashboard-container">
        
        <!-- Page Title Section -->
        <section class="hero-card" id="blog-header">
            <h1 data-en="Financial Articles Hub" data-hi="वित्तीय लेख संग्रह">वित्तीय लेख संग्रह</h1>
            <p data-en="Click on any title below to read the complete detailed article." data-hi="नीचे दिए गए किसी भी शीर्षक पर क्लिक करके पूरा विस्तृत लेख पढ़ें।">नीचे दिए गए किसी भी शीर्षक पर क्लिक करके पूरा विस्तृत लेख पढ़ें।</p>
        </section>

        <!-- Articles List Container -->
        <div id="articles-wrapper" style="margin-top: 25px;">
            <!-- यहाँ जावास्क्रिप्ट के जरिए सभी आर्टिकल्स की लिस्ट और उनका पूरा कंटेंट लोड होगा -->
        </div>

        <!-- Back to Home -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="../index.html" style="color: #38bdf8; text-decoration: none; font-size: 1rem;" data-en="← Back to Dashboard" data-hi="← डैशबोर्ड पर वापस जाएं">← डैशबोर्ड पर वापस जाएं</a>
        </div>

    </main>

    <!-- Footer Links -->
    <footer class="dashboard-footer">
        <div class="footer-links">
            <a href="../privacy-policy.html" data-en="Privacy Policy" data-hi="गोपनीयता नीति">गोपनीयता नीति</a> |
            <a href="../terms-and-conditions.html" data-en="Terms" data-hi="नियम व शर्तें">नियम व शर्तें</a> |
            <a href="../disclaimer.html" data-en="Disclaimer" data-hi="अस्वीकरण">अस्वीकरण</a>
        </div>
        <p>&copy; 2026 Fengoo.in. All rights reserved.</p>
    </footer>

    <!-- Script to render list and handle clicks -->
    <script>
        const articles = [
            {
                id: 1,
                titleHi: "आर्टिकल 1: पैसे बचाने के स्मार्ट और व्यावहारिक तरीके",
                titleEn: "Article 1: Smart and Practical Money Saving Ways",
                contentHi: "आज के समय में वित्तीय सुरक्षा हर व्यक्ति के लिए सबसे महत्वपूर्ण प्राथमिकता है। जब तक आप अपने मासिक खर्चों को नियंत्रित करना नहीं सीखेंगे, तब तक बड़ी बचत करना नामुमकिन है। सबसे पहले अपने सभी खर्चों को ट्रैक करें। 'नीड्स' (जरूरतों) और 'वॉन्ट्स' (इच्छाओं) के बीच अंतर समझना बेहद जरूरी है। इसके अलावा, ऑटोमैटिक सेविंग्स का विकल्प चुनें ताकि सैलरी आते ही कुछ हिस्सा सीधे बचत खाते या निवेश में चला जाए। छोटे-छोटे खर्च जैसे बाहर का खाना या अनियोजित शॉपिंग महीनों में एक बड़ा अमाउंट बना लेते हैं। इन आदतों में बदलाव करके आप अपने वित्तीय भविष्य को मजबूत कर सकते हैं...",
                contentEn: "In today's time, financial security is the most important priority for every individual. Unless you learn to control your monthly expenses, making big savings is impossible..."
            },
            {
                id: 2,
                titleHi: "आर्टिकल 2: म्यूचुअल फंड और एसआईपी (SIP) की पूरी जानकारी",
                titleEn: "Article 2: Complete Guide to Mutual Funds & SIP",
                contentHi: "म्यूचुअल फंड निवेश का एक ऐसा माध्यम है जहाँ कई निवेशकों का पैसा इकट्ठा करके शेयर बाजार या बॉन्ड में निवेश किया जाता है। एसआईपी (Systematic Investment Plan) के जरिए आप हर महीने छोटी राशि (जैसे 500 रुपये) से भी निवेश की शुरुआत कर सकते हैं। इसमें कंपाउंडिंग (चक्रवृद्धि ब्याज) की ताकत मिलती है, जिससे लंबे समय में भारी रिटर्न मिलने की संभावना बढ़ जाती है। निवेश शुरू करने से पहले अपने जोखिम लेने की क्षमता (Risk Appetite) को जरूर समझें और हमेशा लॉन्ग-टर्म नजरिए के साथ आ आएं...",
                contentEn: "Mutual fund is a medium of investment where money from multiple investors is pooled and invested in the stock market or bonds..."
            },
            {
                id: 3,
                titleHi: "आर्टिकल 3: सही हेल्थ इंश्योरेंस चुनने के 5 महत्वपूर्ण नियम",
                titleEn: "Article 3: 5 Important Rules to Choose the Right Health Insurance",
                contentHi: "चिकित्सा आपातकाल कभी भी बताकर नहीं आते। एक बड़ा मेडिकल बिल आपकी जिंदगीभर की जमा पूंजी को खत्म कर सकता है। इसलिए परिवार के लिए एक पर्याप्त कवर वाला हेल्थ इंश्योरेंस होना बेहद जरूरी है। पॉलिसी लेते समय हमेशा 'नो क्लेम बोनस', 'को-पेमेंट क्लॉज', और 'रूम रेंट लिमिट' जैसी शर्तों को ध्यान से पढ़ें। हमेशा ऐसे अस्पतालों का नेटवर्क चुनें जो आपके घर के पास हों ताकि कैशलेस क्लेम लेने में कोई असुविधा न हो...",
                contentEn: "Medical emergencies never knock before arriving. A huge medical bill can wipe out your lifetime savings..."
            }
            // इसी तरह आप यहाँ अपने बाकी 100 आर्टिकल्स जोड़ सकते हैं
        ];

        function renderArticleList() {
            const lang = localStorage.getItem("fengoo_lang") || "hi";
            const wrapper = document.getElementById("articles-wrapper");
            wrapper.innerHTML = "";

            articles.forEach((art, index) => {
                const title = lang === "en" ? art.titleEn : art.titleHi;
                const content = lang === "en" ? art.contentEn : art.contentHi;

                const itemDiv = document.createElement("div");
                itemDiv.className = "article-list-item";
                itemDiv.innerHTML = `
                    <h3 class="article-title">${index + 1}. ${title}</h3>
                    <div class="full-article-content" id="content-${art.id}">
                        <button class="back-to-list-btn" onclick="hideArticle(${art.id})">← ${lang === 'en' ? 'Back to List' : 'सूची पर वापस जाएं'}</button>
                        <h2 style="color:#fff; margin-bottom:15px;">${title}</h2>
                        <p>${content}</p>
                    </div>
                `;

                // टाइटल पर क्लिक करने पर आर्टिकल खुलेगा
                itemDiv.addEventListener("click", (e) => {
                    // अगर यूजर अंदर के बटन पर क्लिक करे तो लिस्ट बंद न हो
                    if(e.target.tagName === 'BUTTON') return;
                    toggleArticle(art.id);
                });

                wrapper.appendChild(itemDiv);
            });
        }

        function toggleArticle(id) {
            const contentBox = document.getElementById(`content-${id}`);
            // बाकी खुले हुए बंद कर दें और इसे टॉगल करें
            const allContents = document.querySelectorAll('.full-article-content');
            allContents.forEach(box => {
                if(box.id !== `content-${id}`) box.style.display = 'none';
            });

            if (contentBox.style.display === "block") {
                contentBox.style.display = "none";
            } else {
                contentBox.style.display = "block";
                contentBox.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function hideArticle(id) {
            const contentBox = document.getElementById(`content-${id}`);
            contentBox.style.display = 'none';
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderArticleList();
        });
    </script>

    <!-- Scripts -->
    <script src="../js/script.js"></script>
    <script src="../js/language.js"></script>
</body>
</html>
