<!DOCTYPE html>
<html lang="hi">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RCYSCD4P57"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RCYSCD4P57');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Fengoo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- अलग से बनाई गई CSS फाइल यहाँ लिंक है -->
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <!-- हेडर -->
    <header class="contact-header">
        <div class="logo-container">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h2>Fengoo<span>.in</span></h2>
            </a>
        </div>
        
        <!-- Language Switcher Dropdown -->
        <div class="lang-switcher-container">
            <select id="languageSelect" onchange="changeLanguage(this.value)" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; outline: none; font-size: 0.9rem;">
                <option value="hi">हिंदी</option>
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="mr">मराठी</option>
                <option value="gu">ગુજરાતી</option>
                <option value="ta">தமிழ்</option>
                <option value="te">తెలుగు</option>
            </select>
        </div>
    </header>

    <!-- मुख्य संपर्क बॉक्स -->
    <main>
        <div class="contact-container">
            <h2 style="text-align: center; margin-bottom: 10px; color: #f8fafc;" data-en="Contact Us" data-hi="हमसे संपर्क करें">हमसे संपर्क करें</h2>
            <p style="text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;" data-en="Fill in your details and description below to reach out to us." data-hi="हमसे बात करने के लिए नीचे अपना विवरण और विवरण (डिस्क्रिप्शन) भरें।">हमसे बात करने के लिए नीचे अपना विवरण और विवरण (डिस्क्रिप्शन) भरें।</p>

            <!-- Formspree फॉर्म (मैसेज सीधा आपके जीमेल पर आएगा) -->
            <form action="https://formspree.io/f/xeeyywej" method="POST">
                
                <!-- नाम का बॉक्स -->
                <div class="form-group">
                    <label data-en="Your Name:" data-hi="आपका नाम (Name):">आपका नाम (Name):</label>
                    <input type="text" name="name" required placeholder="अपना पूरा नाम दर्ज करें">
                </div>

                <!-- ईमेल का बॉक्स -->
                <div class="form-group">
                    <label data-en="Your Email:" data-hi="आपका ईमेल (Email):">आपका ईमेल (Email):</label>
                    <input type="email" name="email" required placeholder="example@gmail.com">
                </div>

                <!-- डिस्क्रिप्शन / संदेश का बॉक्स -->
                <div class="form-group">
                    <label data-en="Description / Message:" data-hi="डिस्क्रिप्शन / संदेश (Description):">डिस्क्रिप्शन / संदेश (Description):</label>
                    <textarea name="message" rows="4" required placeholder="अपना संदेश या विवरण यहाँ विस्तार से लिखें..."></textarea>
                </div>

                <!-- भेजने वाला बटन -->
                <button type="submit" class="submit-btn" data-en="Send Message" data-hi="संदेश भेजें">संदेश भेजें</button>
            </form>

            <!-- होम पर वापस जाने का लिंक -->
            <div class="back-link" style="margin-top: 20px; text-align: center;">
                <a href="index.html" style="color: #38bdf8; text-decoration: none;" data-en="← Back to Home" data-hi="← होम पर वापस जाएं">← होम पर वापस जाएं</a>
            </div>
        </div>
    </main>

    <!-- फुटर -->
    <footer class="dashboard-footer" style="text-align: center; padding: 20px; color: #64748b; font-size: 0.85rem;">
        <p>&copy; 2026 Fengoo.in. All rights reserved.</p>
    </footer>

    <!-- जावास्क्रिप्ट स्क्रिप्ट्स -->
    <script src="js/script.js"></script>
    <script src="js/language.js"></script>
</body>
</html>
