<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Fengoo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Top Dashboard Header -->
    <header class="dashboard-header">
        <div class="logo-container">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h2>Fengoo<span>.in</span></h2>
            </a>
        </div>
        
        <!-- Round Language Switcher Button -->
        <div class="lang-switcher-container">
            <button id="langToggleBtn" class="round-lang-btn" onclick="toggleLanguage()">
                <span id="langText">ENG</span>
            </button>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="dashboard-container">
        
        <!-- Page Title Section -->
        <section class="hero-card">
            <h1 data-en="Contact Us" data-hi="संपर्क करें">संपर्क करें</h1>
            <p data-en="Have questions, feedback, or need support? Reach out to us." data-hi="कोई प्रश्न, प्रतिक्रिया है या सहायता की आवश्यकता है? हमसे संपर्क करें।">कोई प्रश्न, प्रतिक्रिया है या सहायता की आवश्यकता है? हमसे संपर्क करें।</p>
        </section>

        <!-- Content Card -->
        <div class="dash-card" style="line-height: 1.8; color: #94a3b8;">
            <p data-en="Email: support@fengoo.in" data-hi="ईमेल: support@fengoo.in">ईमेल: support@fengoo.in</p>
            <p data-en="Our team is available Monday through Saturday to assist you with your queries." data-hi="हमारी टीम आपके प्रश्नों में सहायता के लिए सोमवार से शनिवार तक उपलब्ध है।">हमारी टीम आपके प्रश्नों में सहायता के लिए सोमवार से शनिवार तक उपलब्ध है।</p>
        </div>

        <!-- Back to Home -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 1rem;" data-en="← Back to Dashboard" data-hi="← डैशबोर्ड पर वापस जाएं">← डैशबोर्ड पर वापस जाएं</a>
        </div>

    </main>

    <!-- Footer Links -->
    <footer class="dashboard-footer">
        <div class="footer-links">
            <a href="privacy-policy.html" data-en="Privacy Policy" data-hi="गोपनीयता नीति">गोपनीयता नीति</a> |
            <a href="terms-and-conditions.html" data-en="Terms" data-hi="नियम व शर्तें">नियम व शर्तें</a> |
            <a href="disclaimer.html" data-en="Disclaimer" data-hi="अस्वीकरण">अस्वीकरण</a>
        </div>
        <p>&copy; 2026 Fengoo.in. All rights reserved.</p>
    </footer>

    <!-- Scripts Linking -->
    <script src="js/script.js"></script>
    <script src="js/language.js"></script>
</body>
</html>
