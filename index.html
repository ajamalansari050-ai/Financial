<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fengoo - Professional Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        header {
            margin-top: 40px;
        }
        h1 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
        }
        .main-content {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 700px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s ease;
        }
        .btn:hover {
            background: #0ea5e9;
            color: #ffffff;
            transform: translateY(-2px);
        }
        footer {
            margin-bottom: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Fengoo</h1>
        
    </header>

    <div class="main-content">
        <h2>जल्द ही कुछ नया आ रहा है...</h2>
        <p>हम इस वेबसाइट को आपके लिए और बेहतर बना रहे हैं। हमारे साथ बने रहें।</p>
        <a href="#" class="btn">और जानें</a>
    </div>

    <footer>
        &copy; 2026 Fengoo.in. All rights reserved.
    </footer>

</body>
</html>
