<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Fengoo</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <!-- हेडर -->
    <header class="contact-header">
        <div class="logo-container">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h2>Fengoo<span>.in</span></h2>
            </a>
        </div>
        <div class="lang-switcher-container">
            <select id="languageSelect" onchange="changeLanguage(this.value)" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; outline: none;">
                <option value="hi">हिंदी</option>
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="mr">मराठी</option>
                <option value="gu">ગુજરાતી</option>
                <option value="ta">தமிழ்</option>
                <option value="te">తెలుగు</option>
            </select>
        </div>
    </header>

    <!-- मुख्य कैलकुलेटर बॉक्स -->
    <main>
        <div class="contact-container" style="max-width: 500px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155;">
            <h2 style="text-align: center; margin-bottom: 10px; color: #f8fafc;" data-en="Age Calculator" data-hi="आयु कैलकुलेटर (Age Calculator)">आयु कैलकुलेटर (Age Calculator)</h2>
            <p style="text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px;" data-en="Select your birthdate to calculate your exact age." data-hi="अपनी सटीक आयु जानने के लिए अपनी जन्म तिथि चुनें।">अपनी सटीक आयु जानने के लिए अपनी जन्म तिथि चुनें।</p>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; color: #cbd5e1; margin-bottom: 8px;" data-en="Birth Date:" data-hi="जन्म तिथि (Birth Date):">जन्म तिथि (Birth Date):</label>
                <!-- यहाँ id="birthDate" होना जरूरी है -->
                <input type="date" id="birthDate" style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; outline: none; box-sizing: border-box;">
            </div>

            <!-- बटन पर onclick="calculateAge()" होना जरूरी है -->
            <button onclick="calculateAge()" class="submit-btn" style="width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px;" data-en="Calculate Age" data-hi="आयु की गणना करें">आयु की गणना करें</button>

            <!-- रिजल्ट दिखाने के लिए id="ageResult" -->
            <div id="ageResult" style="text-align: center; font-size: 1.1rem; font-weight: bold; color: #38bdf8; padding: 15px; background: #0f172a; border-radius: 8px; border: 1px solid #334155;">
                आयु: --
            </div>

            <div class="back-link" style="text-align: center; margin-top: 25px;">
                <a href="index.html" style="color: #38bdf8; text-decoration: none;" data-en="← Back to Home" data-hi="← होम पर वापस जाएं">← होम पर वापस जाएं</a>
            </div>
        </div>
    </main>

    <!-- कैलकुलेटर का अपना लॉजिक (JavaScript) -->
    <script>
        function calculateAge() {
            let birthDateVal = document.getElementById("birthDate").value;
            let resultDiv = document.getElementById("ageResult");

            if (!birthDateVal) {
                resultDiv.innerText = "कृपया पहले अपनी जन्म तिथि चुनें!";
                return;
            }

            let birthDate = new Date(birthDateVal);
            let today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                let prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            resultDiv.innerText = `आयु: ${years} वर्ष, ${months} महीने, ${days} दिन`;
        }
    </script>

    <script src="js/language.js"></script>
</body>
</html>
