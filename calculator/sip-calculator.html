<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP Calculator - Fengoo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .calc-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: left;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .calc-btn {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        .calc-result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Top Dashboard Header -->
    <header class="dashboard-header">
        <div class="logo-container">
            <a href="../index.html" style="text-decoration: none; color: inherit;">
                <h2>Fengoo<span>.in</span></h2>
            </a>
        </div>
        
        <!-- Language Switcher Dropdown -->
        <div class="lang-switcher-container">
            <select id="languageSelect" onchange="changeLanguage(this.value)" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; outline: none; font-size: 0.9rem;">
                <option value="hi">हिंदी</option>
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
                <option value="mr">मराठी</option>
                <option value="gu">ગુજરાતી</option>
                <option value="ta">தமிழ்</option>
                <option value="te">తెలుగు</option>
            </select>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="dashboard-container">
        
        <!-- Page Title Section -->
        <section class="hero-card" style="text-align: center;">
            <h1 data-en="SIP Calculator" data-hi="एसआईपी कैलकुलेटर">एसआईपी कैलकुलेटर</h1>
            <p data-en="Estimate your mutual fund investment returns." data-hi="अपने म्यूचुअल फंड निवेश रिटर्न का अनुमान लगाएं।">अपने म्यूचुअल फंड निवेश रिटर्न का अनुमान लगाएं।</p>
        </section>

        <!-- SIP Tool Box -->
        <div class="calc-container">
            <div class="input-group">
                <label data-en="Monthly Investment (₹)" data-hi="मासिक निवेश (₹)">मासिक निवेश (₹)</label>
                <input type="number" id="sipAmount" value="5000">
            </div>
            <div class="input-group">
                <label data-en="Expected Annual Return Rate (%)" data-hi="अपेक्षित वार्षिक रिटर्न दर (%)">अपेक्षित वार्षिक रिटर्न दर (%)</label>
                <input type="number" id="sipRate" value="12">
            </div>
            <div class="input-group">
                <label data-en="Time Period (Years)" data-hi="समय अवधि (वर्ष)">समय अवधि (वर्ष)</label>
                <input type="number" id="sipYears" value="10">
            </div>
            
            <button class="calc-btn" onclick="calculateSIP()" data-en="Calculate SIP" data-hi="SIP की गणना करें">SIP की गणना करें</button>
            
            <div class="calc-result" id="sipResult" data-en="Total Value: ₹0" data-hi="कुल वैल्यू: ₹0">कुल वैल्यू: ₹0</div>
        </div>

        <!-- Back to Calculator Hub -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 1rem;" data-en="← Back to Calculators" data-hi="← कैलकुलेटर हब पर वापस जाएं">← कैलकुलेटर हब पर वापस जाएं</a>
        </div>

    </main>

    <!-- Footer Links -->
    <footer class="dashboard-footer">
        <div class="footer-links">
            <a href="../privacy-policy.html" data-en="Privacy Policy" data-hi="गोपनीयता नीति">गोपनीयता नीति</a> |
            <a href="../terms-and-conditions.html" data-en="Terms" data-hi="नियम व शर्तें">नियम व शर्तें</a> |
            <a href="../disclaimer.html" data-en="Disclaimer" data-hi="अस्वीकरण">अस्वीकरण</a>
        </div>
        <p>&copy; 2026 Fengoo.in. All rights reserved.</p>
    </footer>

    <!-- Scripts Linking -->
    <script src="../js/language.js"></script>
    <script>
        function calculateSIP() {
            let p = parseFloat(document.getElementById('sipAmount').value) || 0;
            let annualRate = parseFloat(document.getElementById('sipRate').value) || 0;
            let years = parseFloat(document.getElementById('sipYears').value) || 0;
            
            let i = (annualRate / 12) / 100;
            let n = years * 12;
            let maturityValue = p * ((Math.pow(1 + i, n) - 1) / i) * (1 + i);
            
            let activeLang = localStorage.getItem("fengoo_lang") || "hi";
            let labelText = (activeLang === 'hi') ? 'कुल वैल्यू: ₹' : 'Total Value: ₹';
            document.getElementById('sipResult').innerText = labelText + (isNaN(maturityValue) ? 0 : maturityValue.toFixed(2));
        }
    </script>
</body>
</html>
