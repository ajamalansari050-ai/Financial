<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Fengoo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .calc-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: left;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }
        .calc-btn {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        .calc-result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Top Dashboard Header -->
    <header class="dashboard-header">
        <div class="logo-container">
            <a href="../index.html" style="text-decoration: none; color: inherit;">
                <h2>Fengoo<span>.in</span></h2>
            </a>
        </div>
        
        <!-- Round Language Switcher Button -->
        <div class="lang-switcher-container">
            <button id="langToggleBtn" class="round-lang-btn" onclick="toggleLanguage()">
                <span id="langText">ENG</span>
            </button>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="dashboard-container">
        
        <!-- Page Title Section -->
        <section class="hero-card" style="text-align: center;">
            <h1 data-en="BMI Calculator" data-hi="बीएमआई (BMI) कैलकुलेटर">बीएमआई (BMI) कैलकुलेटर</h1>
            <p data-en="Check your Body Mass Index to monitor health fitness." data-hi="अपनी स्वास्थ्य फिटनेस की निगरानी के लिए बॉडी मास इंडेक्स जांचें।">अपनी स्वास्थ्य फिटनेस की निगरानी के लिए बॉडी मास इंडेक्स जांचें।</p>
        </section>

        <!-- BMI Tool Box -->
        <div class="calc-container">
            <div class="input-group">
                <label data-en="Weight (kg)" data-hi="वजन (किलोग्राम)">वजन (किलोग्राम)</label>
                <input type="number" id="bmiWeight" value="70">
            </div>
            <div class="input-group">
                <label data-en="Height (cm)" data-hi="लंबाई (सेंटीमीटर)">लंबाई (सेंटीमीटर)</label>
                <input type="number" id="bmiHeight" value="170">
            </div>
            
            <button class="calc-btn" onclick="calculateBMI()" data-en="Calculate BMI" data-hi="BMI की गणना करें">BMI की गणना करें</button>
            
            <div class="calc-result" id="bmiResult">BMI: --</div>
        </div>

        <!-- Back to Calculator Hub -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="index.html" style="color: #38bdf8; text-decoration: none; font-size: 1rem;" data-en="← Back to Calculators" data-hi="← कैलकुलेटर हब पर वापस जाएं">← कैलकुलेटर हब पर वापस जाएं</a>
        </div>

    </main>

    <!-- Footer Links -->
    <footer class="dashboard-footer">
        <div class="footer-links">
            <a href="../privacy-policy.html" data-en="Privacy Policy" data-hi="गोपनीयता नीति">गोपनीयता नीति</a> |
            <a href="../terms-and-conditions.html" data-en="Terms" data-hi="नियम व शर्तें">नियम व शर्तें</a> |
            <a href="../disclaimer.html" data-en="Disclaimer" data-hi="अस्वीकरण">अस्वीकरण</a>
        </div>
        <p>&copy; 2026 Fengoo.in. All rights reserved.</p>
    </footer>

    <!-- Scripts Linking -->
    <script src="../js/script.js"></script>
    <script src="../js/language.js"></script>
    <script>
        function calculateBMI() {
            let weight = parseFloat(document.getElementById('bmiWeight').value);
            let heightCm = parseFloat(document.getElementById('bmiHeight').value);
            
            if(!weight || !heightCm) {
                document.getElementById('bmiResult').innerText = currentLang === 'hi' ? 'कृपया सही मान दर्ज करें!' : 'Please enter valid values!';
                return;
            }
            
            let heightM = heightCm / 100;
            let bmi = (weight / (heightM * heightM)).toFixed(1);
            let status = '';
            
            if(bmi < 18.5) {
                status = currentLang === 'hi' ? ' (कम वजन / Underweight)' : ' (Underweight)';
            } else if(bmi >= 18.5 && bmi < 24.9) {
                status = currentLang === 'hi' ? ' (सामान्य / Normal)' : ' (Normal weight)';
            } else if(bmi >= 25 && bmi < 29.9) {
                status = currentLang === 'hi' ? ' (अधिक वजन / Overweight)' : ' (Overweight)';
            } else {
                status = currentLang === 'hi' ? ' (मोटापा / Obesity)' : ' (Obesity)';
            }
            
            document.getElementById('bmiResult').innerText = `BMI: ${bmi}${status}`;
        }
    </script>
</body>
</html>
