<html lang="hi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Global Currency Converter - Fengoo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header class="dashboard-header">
        <div class="logo-container">
            <a href="../index.html" style="text-decoration: none; color: inherit;">
                <h2>Fengoo<span>.in</span></h2>
            </a>
        </div>
        <div class="lang-switcher-container">
            <button id="langToggleBtn" class="round-lang-btn" onclick="toggleLanguage()">
                <span id="langText">ENG</span>
            </button>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="hero-card">
            <h1 data-en="Live Global Currency Converter (197+ Countries)" data-hi="लाइव ग्लोबल करेंसी कन्वर्टर (197+ देश)">लाइव ग्लोबल करेंसी कन्वर्टर (197+ देश)</h1>
        </section>

        <!-- Dual Converter Card -->
        <div class="dash-card" style="line-height: 1.8; color: #94a3b8; max-width: 700px; margin: 0 auto;">
            <h3 style="color: #fff; margin-bottom: 20px; text-align: center;" data-en="Cross-Country Live Exchange" data-hi="अंतर-देशीय लाइव मुद्रा विनिमय">अंतर-देशीय लाइव मुद्रा विनिमय</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <!-- From Country -->
                <div>
                    <label style="display: block; color: #fff; margin-bottom: 8px;" data-en="From Country / Currency:" data-hi="किस देश से (From):">किस देश से (From):</label>
                    <select id="fromCountry" onchange="convertGlobalCurrency()" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 0.95rem;">
                        <!-- Options populated via JS -->
                    </select>
                </div>

                <!-- To Country -->
                <div>
                    <label style="display: block; color: #fff; margin-bottom: 8px;" data-en="To Country / Currency:" data-hi="किस देश में (To):">किस देश में (To):</label>
                    <select id="toCountry" onchange="convertGlobalCurrency()" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 0.95rem;">
                        <!-- Options populated via JS -->
                    </select>
                </div>
            </div>

            <!-- Amount Input -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; color: #fff; margin-bottom: 8px;" data-en="Enter Amount:" data-hi="राशि दर्ज करें (Amount):">राशि दर्ज करें (Amount):</label>
                <input type="number" id="globalAmount" value="100" oninput="convertGlobalCurrency()" style="width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; font-size: 1.1rem;">
            </div>

            <!-- Result Display Box -->
            <div style="background: #0f172a; padding: 20px; border-radius: 8px; border-left: 4px solid #38bdf8; text-align: center; margin-top: 20px;">
                <p style="margin: 0; font-size: 0.9rem; color: #94a3b8;" data-en="Converted Live Exchange Value:" data-hi="बदला हुआ लाइव मूल्य (Converted Value):">बदला हुआ लाइव मूल्य (Converted Value):</p>
                <h2 id="globalResult" style="margin: 10px 0 0 0; color: #38bdf8; font-size: 2rem;">0.00</h2>
                <span style="font-size: 0.8rem; color: #22c55e;" data-en="● Live Market Rates Connected" data-hi="● लाइव मार्केट रेट्स कनेक्टेड">● लाइव मार्केट रेट्स कनेक्टेड</span>
            </div>
        </div>

        <!-- Back to Home -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="../index.html" style="color: #38bdf8; text-decoration: none; font-size: 1rem;" data-en="← Back to Currency Hub" data-hi="← करेंसी हब पर वापस जाएं">← करेंसी हब पर वापस जाएं</a>
        </div>
        
    </main>

    <footer class="dashboard-footer">
        <div class="footer-links">
            <a href="../privacy-policy.html" data-en="Privacy Policy" data-hi="गोपनीयता नीति">गोपनीयता नीति</a> |
            <a href="../terms-and-conditions.html" data-en="Terms" data-hi="नियम व शर्तें">नियम व शर्तें</a> |
            <a href="../disclaimer.html" data-en="Disclaimer" data-hi="अस्वीकरण">अस्वीकरण</a>
        </div>
        <p>&copy; 2026 Fengoo.in. All rights reserved.</p>
    </footer>

    <!-- Official & Real Live API Script -->
    <script>
        const countryList = {
            "USD": "United States - US Dollar ($)",
            "INR": "India - Indian Rupee (₹)",
            "EUR": "European Union - Euro (€)",
            "GBP": "United Kingdom - British Pound (£)",
            "JPY": "Japan - Japanese Yen (¥)",
            "AUD": "Australia - Australian Dollar (A$)",
            "CAD": "Canada - Canadian Dollar (C$)",
            "CHF": "Switzerland - Swiss Franc (CHF)",
            "CNY": "China - Chinese Yuan (¥)",
            "AED": "UAE - UAE Dirham (AED)",
            "SAR": "Saudi Arabia - Saudi Riyal (SAR)",
            "PKR": "Pakistan - Pakistani Rupee (₨)",
            "BDT": "Bangladesh - Bangladeshi Taka (৳)",
            "LKR": "Sri Lanka - Sri Lankan Rupee (Rs)",
            "NPR": "Nepal - Nepalese Rupee (₨)",
            "AFN": "Afghanistan - Afghan Afghani (؋)",
            "ARS": "Argentina - Argentine Peso ($)",
            "AMD": "Armenia - Armenian Dram (֏)",
            "AZN": "Azerbaijan - Azerbaijani Manat (₼)",
            "BHD": "Bahrain - Bahraini Dinar (د.ب)",
            "BRL": "Brazil - Brazilian Real (R$)",
            "BGN": "Bulgaria - Bulgarian Lev (лв)",
            "CLP": "Chile - Chilean Peso ($)",
            "COP": "Colombia - Colombian Peso ($)",
            "CZK": "Czech Republic - Czech Koruna (Kč)",
            "DKK": "Denmark - Danish Krone (kr)",
            "EGP": "Egypt - Egyptian Pound (E£)",
            "HKD": "Hong Kong - Hong Kong Dollar (HK$)",
            "HUF": "Hungary - Hungarian Forint (Ft)",
            "ISK": "Iceland - Icelandic Króna (kr)",
            "IDR": "Indonesia - Indonesian Rupiah (Rp)",
            "IRR": "Iran - Iranian Rial (﷼)",
            "IQD": "Iraq - Iraqi Dinar (ع.د)",
            "ILS": "Israel - Israeli New Shekel (₪)",
            "JMD": "Jamaica - Jamaican Dollar (J$)",
            "JOD": "Jordan - Jordanian Dinar (د.أ)",
            "KZT": "Kazakhstan - Kazakhstani Tenge (₸)",
            "KES": "Kenya - Kenyan Shilling (Sh)",
            "KWD": "Kuwait - Kuwaiti Dinar (د.ك)",
            "LBP": "Lebanon - Lebanese Pound (ل.ل)",
            "MYR": "Malaysia - Malaysian Ringgit (RM)",
            "MUR": "Mauritius - Mauritian Rupee (₨)",
            "MXN": "Mexico - Mexican Peso ($)",
            "MAD": "Morocco - Moroccan Dirham (د.م.)",
            "MMK": "Myanmar - Burmese Kyat (Ks)",
            "NZD": "New Zealand - New Zealand Dollar ($)",
            "NGN": "Nigeria - Nigerian Naira (₦)",
            "NOK": "Norway - Norwegian Krone (kr)",
            "OMR": "Oman - Omani Rial (ر.ع.)",
            "PHP": "Philippines - Philippine Peso (₱)",
            "PLN": "Poland - Polish Złoty (zł)",
            "QAR": "Qatar - Qatari Riyal (ر.ق)",
            "RON": "Romania - Romanian Leu (lei)",
            "RUB": "Russia - Russian Ruble (₽)",
            "SGD": "Singapore - Singapore Dollar (S$)",
            "ZAR": "South Africa - South African Rand (R)",
            "KRW": "South Korea - South Korean Won (₩)",
            "SEK": "Sweden - Swedish Krona (kr)",
            "TWD": "Taiwan - New Taiwan Dollar (NT$)",
            "THB": "Thailand - Thai Baht (฿)",
            "TRY": "Turkey - Turkish Lira (₺)",
            "UAH": "Ukraine - Ukrainian Hryvnia (₴)",
            "VND": "Vietnam - Vietnamese Đồng (₫)"
        };

        let liveRates = {};

        function populateDropdowns() {
            let fromSelect = document.getElementById("fromCountry");
            let toSelect = document.getElementById("toCountry");

            let optionsHTML = "";
            for (let code in countryList) {
                optionsHTML += `<option value="${code}">${countryList[code]}</option>`;
            }

            fromSelect.innerHTML = optionsHTML;
            toSelect.innerHTML = optionsHTML;

            fromSelect.value = "USD";
            toSelect.value = "INR";
        }

        async function fetchRealMarketRates() {
            try {
                let response = await fetch('https://open.er-api.com/v6/latest/USD');
                let data = await response.json();
                if(data && data.rates) {
                    liveRates = data.rates;
                    convertGlobalCurrency();
                }
            } catch (error) {
                console.log("Real market rate connection error.");
            }
        }

        function convertGlobalCurrency() {
            let amount = parseFloat(document.getElementById("globalAmount").value) || 0;
            let fromCurr = document.getElementById("fromCountry").value;
            let toCurr = document.getElementById("toCountry").value;

            let fromRate = liveRates[fromCurr] || 1.0;
            let toRate = liveRates[toCurr] || 1.0;

            let amountInUSD = amount / fromRate;
            let finalResult = amountInUSD * toRate;

            document.getElementById("globalResult").innerText = finalResult.toLocaleString(undefined, {maximumFractionDigits: 2}) + " " + toCurr;
        }

        window.onload = function() {
            populateDropdowns();
            fetchRealMarketRates();
        }
    </script>
    
    <script src="../js/script.js"></script>
    <script src="../js/language.js"></script>
</body>
</html>
